[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ipovtich-api"
version = "0.1.0"
description = "IPovtich FastAPI backend: network topology parsing API"
authors = [{ name = "KROKODLL" }]
requires-python = ">=3.11"

[project.urls]
Author = "https://github.com/KROKODLL"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "pydantic>=2.10.0",
  "defusedxml>=0.7.1",
  "slowapi>=0.1.9",
  "PyJWT>=2.8.0",
  "bcrypt>=4.1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=app", "--cov-report=term-missing", "--cov-fail-under=100"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
fail_under = 100
show_missing = true
